<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolutions, Statements & Projects — YCDI</title>
  <meta name="description" content="Official declarations, policy positions and key initiatives of the Youth of the Centrist Democrat International (YCDI).">
  <meta name="theme-color" content="#004AAD">
  <link rel="icon" href="assets/logos/ycdi-isotipo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .filters { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; padding: 20px 0; border-top: var(--filete) solid var(--azul-medio); border-bottom: 1px solid var(--linea); margin-bottom: 8px; position: sticky; top: var(--header-h); background: #fff; z-index: 5; }
    .searchbox { display: flex; align-items: center; gap: 8px; border-bottom: var(--filete) solid var(--borde-control); padding: 6px 2px; min-width: min(320px, 100%); }
    .searchbox svg { width: 18px; height: 18px; color: var(--tinta-suave); flex: none; }
    .searchbox input { border: 0; outline: 0; font: inherit; font-size: 15px; width: 100%; background: transparent; color: var(--tinta); }
    .searchbox:focus-within { border-color: var(--azul-ycdi); }
    select.year { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); border-radius: 0; }

    .docs { list-style: none; margin: 0; padding: 0; }
    .doc { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: 32px; padding: 40px 0; border-bottom: 1px solid var(--linea); align-items: start; }
    .doc__preview { width: 160px; aspect-ratio: 1 / 1.3; background: #fff; box-shadow: 0 0 0 1px var(--linea); position: relative; overflow: hidden; transition: transform .4s var(--ease); }
    .doc:hover .doc__preview { transform: translateY(-4px) rotate(-1.5deg); }
    .doc__preview { display: block; }
    .doc { grid-template-columns: 240px minmax(0, 1fr) auto; }
    .doc__preview { width: 240px; aspect-ratio: 1 / 1.3; max-width: 160px; justify-self: center; }
    .doc__preview--wide { aspect-ratio: auto; max-width: 240px; }
    .doc__preview--wide .doc__cover { height: auto; aspect-ratio: 16 / 9; }
    .doc__cover { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .doc__band { background: var(--azul-ycdi); height: 22%; display: flex; align-items: center; padding: 0 10px; }
    .doc__band img { height: 60%; width: auto; }
    .doc__lines { padding: 12px 12px; display: grid; gap: 7px; }
    .doc__lines i { display: block; height: 4px; background: var(--linea); }
    .doc__lines i:first-child { width: 80%; height: 6px; background: var(--tinta); opacity: .8; }
    .doc__lines i:nth-child(2) { width: 60%; height: 5px; background: var(--azul-medio); }
    .doc__lines i:nth-child(n+3) { width: 100%; }
    .doc__lines i:last-child { width: 55%; }
    .doc__type { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 10px; background: var(--azul-suave); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--azul-ycdi); }
    .doc__meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--tinta-suave); font-weight: 500; }
    .doc h2 { font-size: clamp(21px, 2vw, 26px); line-height: 1.3; color: var(--azul-profundo); margin-bottom: 12px; }
    .doc p { margin: 0; color: var(--tinta-suave); max-width: 70ch; }
    .doc__actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .doc__soon { font-size: 13px; color: var(--tinta-suave); }
    .empty { padding: 64px 0; text-align: center; color: var(--tinta-suave); }
    @media (max-width: 820px) {
      .doc { grid-template-columns: 1fr; gap: 16px; }
      .doc__preview { width: 120px; justify-self: start; }
      .doc__preview--wide { width: 100%; max-width: 320px; }
      .doc__actions { grid-column: 1 !important; }
      .doc__actions { grid-column: 2; align-items: flex-start; }
      .filters { position: static; }
    }
  </style>
</head>
<body data-page="resolutions">
  <header data-site-header></header>

  <main id="main">
    <section class="hero hero--compact on-blue">
      <img class="flame-mark" src="assets/logos/ycdi-isotipo-blanco.svg" alt="" aria-hidden="true">
      <div class="wrap hero__grid">
        <span class="antetitulo reveal">Official record</span>
        <h1 class="display reveal" style="--d:.1s; max-width: 14ch">Resolutions, statements and projects</h1>
        <div class="hero__rule reveal-line"></div>
        <p class="lead reveal" style="--d:.2s; margin:0">The official declarations, policy positions and key initiatives advanced by the organization: a living record of the youth movement's commitments on democracy, human rights, sustainability and youth empowerment.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 48px">
      <div class="wrap">
        <div class="filters">
          <div class="chips" id="type-chips" role="group" aria-label="Filter by type"></div>
          <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap">
            <select class="year" id="year" aria-label="Filter by year"><option value="">All years</option></select>
            <label class="searchbox"><span data-icon="search"></span><span class="sr-only">Search</span><input id="q" type="search" placeholder="Search titles and summaries"></label>
          </div>
        </div>
        <ul class="docs" id="docs" aria-live="polite"></ul>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>

  <script src="assets/js/site.js"></script>
  <script>
  (function () {
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const fmt = d => { const [y, m, day] = String(d).split("-"); return m ? `${day ? +day + " " : ""}${MONTHS[+m - 1]} ${y}` : y; };
    let items = [], type = "All";

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const year = document.getElementById("year").value;
      const list = items.filter(i =>
        (type === "All" || i.type === type) &&
        (!year || String(i.date).startsWith(year)) &&
        (!q || (i.title + " " + i.summary + " " + (i.region || "")).toLowerCase().includes(q)));
      const box = document.getElementById("docs");
      if (!list.length) { box.innerHTML = '<li class="empty">No documents match these filters.</li>'; return; }
      box.innerHTML = list.map((i, n) => `
        <li class="doc reveal" style="--d:${Math.min(n, 5) * 0.06}s">
          <${i.file ? `a href="documents/${esc(i.file)}" target="_blank" rel="noopener" tabindex="-1"` : "div"} class="doc__preview${i.type === "Project" ? " doc__preview--wide" : ""}" aria-hidden="true">
            ${i.cover
              ? `<img class="doc__cover" src="documents/covers/${esc(i.cover)}" alt="" loading="lazy">`
              : `<div class="doc__band"><img src="assets/logos/ycdi-logo-simple-blanco.svg" alt=""></div>
                 <div class="doc__lines"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>`}
            <div class="doc__type">${esc(i.type)}</div>
          </${i.file ? "a" : "div"}>
          <div>
            <div class="doc__meta">
              <span class="tag">${esc(i.type)}</span><span>${esc(i.date_label || fmt(i.date))}</span>
              ${i.region ? `<span class="pill">${esc(i.region)}</span>` : ""}
              ${i.sample ? '<span class="pill pill--sample">Example</span>' : ""}
            </div>
            <h2>${esc(i.title)}</h2>
            <p>${esc(i.summary)}</p>
          </div>
          <div class="doc__actions">
            ${i.file
              ? `<a class="btn btn--ghost btn--sm" href="documents/${esc(i.file)}" target="_blank" rel="noopener">Download PDF <span data-icon="download"></span></a>`
              : `<span class="doc__soon">PDF coming soon</span>`}
          </div>
        </li>`).join("");
      YCDI.fillIcons(box); YCDI.initReveal();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const d = await (await fetch("data/resolutions.json", { cache: "no-cache" })).json();
        items = d.items.sort((a, b) => String(b.date).localeCompare(String(a.date)));
      } catch (e) { console.error(e); }
      const types = ["All", ...new Set(items.map(i => i.type))];
      const chips = document.getElementById("type-chips");
      chips.innerHTML = types.map(t => `<button class="chip" aria-pressed="${t === "All"}" data-t="${esc(t)}">${esc(t)}<small>${t === "All" ? items.length : items.filter(i => i.type === t).length}</small></button>`).join("");
      chips.addEventListener("click", e => {
        const b = e.target.closest(".chip"); if (!b) return;
        type = b.dataset.t; chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); render();
      });
      const years = [...new Set(items.map(i => String(i.date).slice(0, 4)))].sort().reverse();
      document.getElementById("year").insertAdjacentHTML("beforeend", years.map(y => `<option>${y}</option>`).join(""));
      document.getElementById("year").addEventListener("change", render);
      document.getElementById("q").addEventListener("input", render);
      render();
    });
  })();
  </script>
</body>
</html>
